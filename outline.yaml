talk:
  title: "My Standards, Their Keyboard"
  slug: "jrush26-my-standards"
  speakers: ["Pasha Finkelshteyn"]
  duration_min: 30
  audience: "JVM/backend developers at JRush who already use an AI coding assistant daily and are unhappy with what it ships"
  audience_spread: "heterogeneous"
  mode: "Journey Mapping"
  venue: "JRush 2026"
  slide_budget: 36
  pacing_wpm: [130, 150]
  architecture: "narrative-arc"      # Phase 2 Decision — pending author confirmation
  engine: null                       # upstream Renderer enum has no `slidev`; see engine_source
  deck_theme: "slidev:seriph (pending Phase 2 theme pick)"
  engine_source: "author-directed: Slidev (markdown deck). Upstream schema enum is pptx|presenterm only — issue #318."
  commercial_intent: "none"
  profanity_register: "zero; never on slides"
  delivery_date: null
  catalog_reference: "sessions-catalog.md — My Standards, Their Keyboard"
  thesis: |
    The model has no preferences; mine took ten years to form. An AI-assisted
    process is the only place those preferences can get in — and four of the five
    processes I ran failed for the same reason: each one made decisions that were
    mine to make. Vibe coding was fast and unreviewable. Guidelines-first was the
    first time my preferences survived a whole session. Full spec rigor was
    thorough enough that I stopped opening it. The fourth was good on paper and
    never fit how I work. The fifth — the one I still run — encodes what I decide
    instead of deciding for me. That distinction, encode vs replace, is a test the
    audience can run against whatever process they use now.
  tldr: |
    I ran five AI-assisted development processes on real work and kept one. This
    talk shows all five on screen with their actual artifacts: what each produced,
    and the specific way four of them fell over — too loose (unreviewable), too
    heavy (stopped opening it), wrong shape (never fit my work).

    The common defect in every process I dropped: it made the decisions that are
    mine to make. The one I kept writes down what I decide. You leave with one
    test — does this process encode my preferences, or replace them? — and the
    process I run today, in enough detail to run it yourself.
  must_include:
    - "All five processes visible on screen with real artifacts from real work"
    - "The encode-vs-replace test, stated plainly and applied on stage"
    - "Named failure mode per dropped process: no artifact / rules without reasons / too much volume / all at one gate"
    - "Hard 4-minute closing allocation (recurring `shortchanged` antipattern)"
  must_avoid:
    - "Tool review framing — the five processes are evidence, not the subject"
    - "BellSoft positioning or any vendor pitch"
    - "Overlap with Git Panic to Git Zen (AI driving one tool) and JOIN Club (reading AI-written SQL)"
    - "Broad pop culture beyond the single And Then There Were None subtitle riff"
  applied_patterns:
    - id: "narrative-arc"
    - id: "entertainment"
    - id: "mentor"
    - id: "bookends"
    - id: "master-story"
      story_id: "five-processes"
      beat: "introduce"
    - id: "foreshadowing"
      plant_id: "the-rejected-pr"
    - id: "inoculation"
      resistance_vector: "vulnerabilities"
    - id: "context-keeper"
    - id: "expansion-joints"

chapters:
  - id: "hook"
    title: "The PR I Would Have Rejected"
    target_min: 3
    accent: "red"
    argument_beats:
      - text: "A PR I shipped, AI-written, that I skimmed and approved. Read properly a week later, it is code I would have sent back from anyone on my team."
        tags: ["opening", "concrete"]
      - text: "Nothing broke, and there was no bug to find. The code simply was not how I write code, and I had signed off on it anyway."
        tags: ["twist"]
      - text: "The gap between what I approved and what I would have accepted in review is what this whole talk is about."
        tags: ["stakes"]

  - id: "thesis"
    title: "The Model Has No Preferences"
    target_min: 2
    accent: "grey"
    argument_beats:
      - text: "Ten-plus years in the JVM ecosystem gave me strong opinions about how code should look and which tools I reach for. The model has none of that."
        tags: ["thesis"]
      - text: "So how do my standards get into code I never typed? One way only: the process I put around the assistant. There is no second channel."
        tags: ["thesis", "big-idea"]
      - text: "Five processes, four dropped. Every one I dropped failed the same way: it made decisions that were mine to make. That observation becomes the test at the end."
        tags: ["foreshadow", "roadmap"]

  - id: "vibe"
    title: "Attempt One: Vibe Coding"
    target_min: 3.5
    accent: "orange"
    argument_beats:
      - text: "Describe the outcome, let it write, look at the result. It was the fastest of the five, by a distance."
        tags: ["what-it-did"]
      - text: "Nothing recorded a single decision, so there was nothing to review against. The diff was the only record I had, and a diff records what changed and never why."
        tags: ["failure-mode"]
      - text: "It also set the bar. Anything slower has to buy back the time it costs me, and that is what the other four were measured against."
        tags: ["credit-where-due"]

  - id: "guidelines"
    title: "Attempt Two: Guidelines First"
    target_min: 4.5
    accent: "green"
    argument_beats:
      - text: "Write the guidelines up front, hand it tasks against them. First time my preferences survived a whole session instead of the first three files."
        tags: ["what-it-did", "turning-point"]
      - text: "The artifact is the point: a written guideline is a decision I made once, in my words, that the model reads every session."
        tags: ["insight"]
      - text: "It solved the task, and I still did not like the code. Guidelines encode rules; the code I would have written comes out of decisions, and most decisions never take the shape of a rule."
        tags: ["failure-mode"]
      - text: "It also never explained itself. With no rationale for any choice, I could not tell a deliberate call from a coin flip, so I never corrected anything. I just overruled it."
        tags: ["failure-mode"]

  - id: "spec-rigor"
    title: "Attempt Three: Full Spec Rigor"
    target_min: 3.5
    accent: "blue"
    cuttable: false
    argument_beats:
      - text: "Specify before implementing. It was thorough, and it was right about what good practice looks like."
        tags: ["what-it-did"]
      - text: "It was heavy, and after a few weeks I stopped opening it. A process you abandon encodes nothing. Its real ceiling is whatever you still run."
        tags: ["failure-mode"]
      - text: "Rigor costs attention, and it costs mine. I am the one component in this system that can quietly opt out."
        tags: ["insight"]

  - id: "wrong-shape"
    title: "Attempt Four: One Enormous Gate"
    target_min: 3.5
    accent: "purple"
    cuttable: true
    argument_beats:
      - text: "Several things right that the others got wrong. Worktrees by default, so parallel work stopped stepping on itself. Credit where it is due."
        tags: ["what-it-did", "credit-where-due"]
      - text: "The material was fine; the timing was not. There is effectively one step where I read an enormous plan with its specs and approve the lot."
        tags: ["failure-mode"]
      - text: "Every decision that was mine to make was real and correctly surfaced. They arrived in one lump, and nobody reviews a lump that size. They skim it, which is what I did to the opening PR."
        tags: ["failure-mode", "callback"]
      - text: "Attempt three drowned me in volume. This one got the volume right and the timing wrong. A process has to spread my decisions across the moments when I can actually make them."
        tags: ["insight"]

  - id: "today"
    title: "What I Run Today"
    target_min: 5
    accent: "yellow"
    argument_beats:
      - text: "The current stack, shown through the artifacts it produced on real work: the files, the diffs, the task entries."
        tags: ["payoff", "concrete"]
      - text: "It survives because it asks me for the decisions that are mine, then writes down what I decided so neither of us re-derives it next week."
        tags: ["encode"]
      - text: "It is also temporary. This is attempt five rather than the answer, and the version on these slides dates fast."
        tags: ["inoculation", "honest-limit"]

  - id: "coda"
    title: "Their Keyboard, Your Standards"
    target_min: 4
    accent: "red"
    argument_beats:
      - text: "The test, stated plainly: does this process encode the decisions that are mine, or does it make them for me?"
        tags: ["the-test", "big-idea"]
      - text: "Run it against the four I dropped — each fails it differently: no artifact at all, rules without the reasons behind them, more volume than I would read, and every decision handed over at one gate."
        tags: ["apply-the-test"]
      - text: "Then run it against whatever you used this morning. If you cannot point at where your standards live in it, they live only in your head."
        tags: ["call-to-action"]
      - text: "Callback to the opening PR: run that same work through a process that encodes, and it is a PR I would have written, because the decisions inside it would have been mine."
        tags: ["bookend", "new-bliss"]

slides:
  - n: 0
    chapter: "hook"
    title: "A PR I Approved"
    format: "EXCEPTION"
    format_justification: "Real screenshot of a real merged PR — the credibility of the whole talk rests on this being an actual artifact, not a mock-up."
    visual: "Screenshot of a merged pull request. Green Merged badge, my name as approver, small diff stat. Nothing annotated yet."
    text_overlay: "none"
    placeholders: ["AUTHOR-01"]
    script:
      - cue: "SLIDE 0 UP"
      - line: "This is a pull request I merged. AI wrote it, I read the diff, it did what I asked, I approved it."
      - line: "AUTHOR-01 — one sentence on what the PR actually did, so the room has context."
      - line: "Nothing broke. There is no incident story at the end of this."
    applied_patterns:
      - id: "opening-punch"
        flavors: ["personal", "unexpected"]
      - id: "master-story"
        story_id: "five-processes"
        beat: "introduce"
    callbacks:
      - kind: "plant"
        id: "the-rejected-pr"

  - n: 1
    chapter: "hook"
    title: "A Week Later"
    format: "EXCEPTION"
    format_justification: "Same screenshot as slide 1 with my review annotations on it — the contrast only works if it is visibly the identical artifact."
    visual: "The same PR screenshot, now covered in the review comments I would have written if it had come from anyone else. Red margin notes."
    text_overlay: "I would have rejected this"
    placeholders: ["SCREENSHOT-02", "AUTHOR-02"]
    script:
      - cue: "SLIDE 1 UP — same screenshot, annotated"
      - line: "A week later I read it properly. These are the comments I would have left if this had come from anyone on my team."
      - line: "AUTHOR-02 — name two or three of the actual objections. None of them are bugs. All of them are choices."
      - parenthetical: "(beat — let them read one of the annotations)"
      - line: "I approved code I would have sent back. So whose fault is that? Not the model's, and that is the uncomfortable part."
    applied_patterns:
      - id: "opening-punch"
        flavors: ["challenging"]
      - id: "walk-around"
        registers: ["C"]

  - n: 2
    chapter: "hook"
    title: "My Standards, Their Keyboard"
    format: "TITLE"
    visual: "Title card, arriving after the hook rather than before it. Subtitle beneath in smaller type."
    text_overlay: "My Standards, Their Keyboard\nFour AI processes, and then there was one"
    script:
      - cue: "SLIDE 2 UP"
      - line: "That is the talk. Five processes, four of them dropped, and the one thing all four got wrong."
  - n: 3
    chapter: "hook"
    title: "Who Is Complaining"
    format: "FULL"
    visual: "Name, handle, one line of context. Small type, no logo wall, no career timeline."
    text_overlay: "Pasha Finkelshteyn · @asm0dey\nTen-plus years in the JVM. Developer Advocate at BellSoft."
    script:
      - cue: "SLIDE 3 UP"
      - line: "Quickly, so you know whose taste you are about to hear about: ten-plus years in the JVM ecosystem, mostly Java and Kotlin, developer advocate at BellSoft."
      - line: "That decade is where my preferences come from, and it is the only reason any of this bothers me."
    applied_patterns:
      - id: "delayed-self-introduction"
      - id: "anti-sell"
  - n: 4
    chapter: "thesis"
    title: "The Model Has No Preferences"
    format: "FULL"
    visual: "Typographic statement slide. One line, large, centered."
    text_overlay: "The model has no preferences.\nMine took ten years."
    script:
      - cue: "SLIDE 4 UP"
      - line: "Ten-plus years in the JVM ecosystem gave me strong opinions about how code should look and which tools I reach for."
      - line: "The model has none of that. Ask it the same question twice and you can get two different styles back, and both are fine by it."

  - n: 5
    chapter: "thesis"
    title: "The Process Is the Channel"
    format: "FULL"
    visual: "Single diagram: me on one side, keyboard/repo on the other, one labelled channel between them marked PROCESS. Everything else greyed."
    text_overlay: "The process is the only channel my standards travel through."
    big_idea: true
    thesis: "preview"
    applied_patterns:
      - id: "call-to-adventure"
        big_idea_text: "An AI process is only worth running if it encodes the decisions that are yours to make, instead of making them for you."
      - id: "walk-around"
        registers: ["D"]
    script:
      - cue: "SLIDE 5 UP"
      - line: "It is their keyboard now. So how does anything of mine get in? Through the process I put around it, and nowhere else."
      - line: "So every time I call the process overhead, I am calling my own standards overhead."

  - n: 6
